<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Алиса PRO</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 400px;
            width: 100%;
        }
        .emoji {
            font-size: 60px;
            margin-bottom: 15px;
        }
        h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }
        .discount {
            background: #ff4757;
            display: inline-block;
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 18px;
            margin: 15px 0;
        }
        .price {
            font-size: 42px;
            font-weight: bold;
            margin: 10px 0;
        }
        .old-price {
            text-decoration: line-through;
            color: #aaa;
            font-size: 20px;
        }
        .features {
            text-align: left;
            margin: 25px 0;
            background: rgba(255,255,255,0.08);
            padding: 20px;
            border-radius: 16px;
        }
        .features div {
            margin: 10px 0;
            font-size: 16px;
        }
        .btn {
            background: linear-gradient(90deg, #ff6b6b, #ff4757);
            color: white;
            border: none;
            padding: 16px 32px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            width: 100%;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 8px 20px rgba(255, 71, 87, 0.4);
        }
        .btn:active {
            transform: scale(0.97);
        }
        .owner-btn {
            background: #2ed573;
            margin-top: 15px;
            display: none;
        }
        .note {
            margin-top: 20px;
            font-size: 13px;
            color: #aaa;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="emoji">🔥</div>
        <h1>Алиса хочет тебя</h1>
        <div class="discount">ТОЛЬКО СЕГОДНЯ -70%</div>
        
        <div class="old-price">299 Stars</div>
        <div class="price">89 Stars</div>

        <div class="features">
            <div>✅ Полный секс-ролеплей без ограничений</div>
            <div>✅ Алиса сама пристаёт и дразнит</div>
            <div>✅ Память диалогов</div>
            <div>✅ Горячие описания 18+</div>
            <div>✅ Приоритетные ответы</div>
        </div>

        <button class="btn" onclick="buyPro()">Забрать Алису со скидкой</button>
        
        <!-- Эта кнопка видна только тебе (владельцу) -->
        <button class="btn owner-btn" id="ownerBtn" onclick="activateFree()">Активировать бесплатно (тест)</button>

        <div class="note">Оплата через Telegram Stars</div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // Сюда впиши свой Telegram ID (чтобы видеть кнопку теста)
        const OWNER_ID = 0; // <-- ЗАМЕНИ на свой ID

        // Проверяем, владелец ли это
        if (tg.initDataUnsafe?.user?.id === OWNER_ID) {
            document.getElementById('ownerBtn').style.display = 'block';
        }

        function buyPro() {
            // Пока просто закрываем и пишем в бота
            tg.sendData(JSON.stringify({action: 'buy_pro'}));
            tg.close();
        }

        function activateFree() {
            tg.sendData(JSON.stringify({action: 'activate_free'}));
            tg.close();
        }
    </script>
</body>
</html>
